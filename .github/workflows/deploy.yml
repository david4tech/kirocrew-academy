name: deploy

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: academy-deploy
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build:shared

      - name: Build content bundles
        run: npm run build:content -- --include-reference

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: CDK synth
        run: npm run cdk -- synth

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: CDK deploy
        run: npm run cdk -- deploy --all --require-approval never --outputs-file cdk-outputs.json
        working-directory: infra

      - name: Read stack outputs into the environment
        run: |
          node -e '
            const fs = require("fs");
            const outputs = JSON.parse(fs.readFileSync("infra/cdk-outputs.json", "utf8"));
            const flat = Object.assign({}, ...Object.values(outputs));
            const lines = [
              `VITE_API_URL=${flat.ApiUrl}`,
              `VITE_USER_POOL_ID=${flat.UserPoolId}`,
              `VITE_USER_POOL_CLIENT_ID=${flat.UserPoolClientId}`,
              `VITE_USER_POOL_DOMAIN=${flat.UserPoolDomain}`,
              `SITE_BUCKET_NAME=${flat.SiteBucketName}`,
              `DISTRIBUTION_ID=${flat.DistributionId}`,
              `DISTRIBUTION_DOMAIN_NAME=${flat.DistributionDomainName}`,
            ];
            fs.appendFileSync(process.env.GITHUB_ENV, lines.join("\n") + "\n");
          '

      - name: Build web app
        run: npm run build:web
        env:
          VITE_API_URL: ${{ env.VITE_API_URL }}
          VITE_USER_POOL_ID: ${{ env.VITE_USER_POOL_ID }}
          VITE_USER_POOL_CLIENT_ID: ${{ env.VITE_USER_POOL_CLIENT_ID }}
          VITE_USER_POOL_DOMAIN: ${{ env.VITE_USER_POOL_DOMAIN }}

      - name: Sync hashed assets with long cache
        run: |
          aws s3 sync web/dist "s3://${SITE_BUCKET_NAME}" \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "index.html"

      - name: Upload index.html with no-cache
        run: |
          aws s3 cp web/dist/index.html "s3://${SITE_BUCKET_NAME}/index.html" \
            --cache-control "no-cache"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${DISTRIBUTION_ID}" \
            --paths "/index.html" "/"

      - name: Smoke test /health
        run: |
          api_status=$(curl -s -o /dev/null -w "%{http_code}" "${VITE_API_URL}/health")
          echo "API /health status: ${api_status}"
          if [ "${api_status}" != "200" ]; then
            echo "Health check failed with status ${api_status}"
            exit 1
          fi
